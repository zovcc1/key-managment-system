[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyring-api"
version = "1.0.0"
description = "Production-grade key-management / crypto-shredding backend"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "shamir-mnemonic>=0.3",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    # keyring/providers/vault_provider.py and kms_provider.py import this at
    # module scope, and keyring/providers/__init__.py imports both providers
    # unconditionally — so httpx is a runtime dependency, not dev/test-only.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["keyring*"]

[tool.pytest.ini_options]
testpaths = ["keyring/tests"]
